<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Complaint</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f4f4f4;
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#1f2027;
color:white;
padding:15px 40px;
font-size:22px;
}

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.card{
width:500px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.card h2{
margin-bottom:20px;
color:#1f2027;
}

input, textarea, select{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#1f2027;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#444;
}

footer{
background:#1f2027;
color:white;
text-align:center;
padding:12px;
}

footer a{
color:#ffb3b3;
text-decoration:none;
}

</style>
</head>

<body>

<header>
Urban Utility Portal
</header>

<div class="main">

<div class="card">

<h2>Register Your Complaint</h2>

<form action="/submit_complaint" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="text" name="ward" placeholder="Ward Number" required>

<select name="category" required>
<option value="">Select Complaint Category</option>
<option value="Water Supply">Water Supply</option>
<option value="Electricity Supply">Street Light</option>

</select>

<textarea name="description" rows="4" placeholder="Describe your complaint..." required></textarea>

<button type="submit">Submit Complaint</button>

</form>

</div>

</div>

<footer>
Admin Access : <a href="/adminpage">Admin Login</a>
</footer>

</body>
</html>
