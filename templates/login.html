<!DOCTYPE html>
<html>
<head>

<title>Utility Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f4f4f4;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* Header */

header{
background:#1f2027;
color:white;
padding:15px 40px;
font-size:22px;
}

/* Main */

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

/* Login Card */

.card{
width:420px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* Inputs */

input{
width:100%;
padding:12px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

/* Buttons */

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#1f2027;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#444;
}

hr{
margin:25px 0;
}

/* Footer */

footer{
background:#1f2027;
color:white;
text-align:center;
padding:10px;
}

footer a{
color:#ffb3b3;
text-decoration:none;
}

</style>

</head>

<body>

<header>
Urban Utility Portal
</header>

<div class="main">

<div class="card">

<h2>User Signup</h2>

<form action="/signup" method="POST">

<input type="text" name="name" placeholder="Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="text" name="ward" placeholder="Ward" required>
<input type="password" name="password" placeholder="Password" required>

<button>Create Account</button>

</form>

<hr>

<h2>User Login</h2>

<form action="/loginuser" method="POST">

<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>

<button>Login</button>

</form>

</div>

</div>

<footer>

Admin Access :
<a href="/adminpage">Admin Login</a>

</footer>

</body>
</html>
