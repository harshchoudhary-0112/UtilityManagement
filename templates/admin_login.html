<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#f4f4f4;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* Header */

header{
background:#1f2027;
color:white;
padding:15px 40px;
font-size:22px;
}

/* Main Layout */

.main{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

/* Login Card */

.card{
width:420px;
background:white;
padding:35px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.card h2{
margin-bottom:20px;
color:#1f2027;
text-align:center;
}

/* Inputs */

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

/* Button */

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
background:#1f2027;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#444;
}

/* Footer */

footer{
background:#1f2027;
color:white;
text-align:center;
padding:12px;
}

footer a{
color:#ffb3b3;
text-decoration:none;
}

</style>
</head>

<body>

<header>
Urban Utility Portal
</header>

<div class="main">

<div class="card">

<h2>Admin Login</h2>

<form action="/adminlogin" method="POST">

<input type="email" name="email" placeholder="Admin Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</div>

</div>

<footer>
Return to <a href="/">Home</a>
</footer>

</body>
</html>
