<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Complaint Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI', sans-serif;
}

/* BODY */
body{
background:linear-gradient(135deg,#eef2f7,#e3f2fd);
min-height:100vh;
display:flex;
flex-direction:column;
padding-bottom:70px;
}

/* HEADER */
header{
position:sticky;
top:0;
z-index:1000;
background:rgba(31,32,39,0.9);
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(10px);
box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

/* NAV BUTTON */
.nav-btn{
padding:8px 16px;
background:linear-gradient(45deg,#00c853,#00e676);
color:white;
border-radius:20px;
text-decoration:none;
font-size:14px;
transition:0.3s;
margin-left:10px;
}

.nav-btn:hover{
transform:scale(1.08);
}

/* MAIN */
.main{
flex:1;
padding:40px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(10px);
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* TITLE */
.card h2{
margin-bottom:20px;
color:#1f2027;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:left;
}

th{
background:#1f2027;
color:white;
}

tr:hover{
background:#f1f1f1;
}

/* FOOTER */
.admin-footer{
position:fixed;
bottom:0;
left:0;
right:0;
background:linear-gradient(45deg,#1f2027,#343a40);
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 25px;
box-sizing:border-box;
}

.footer-link{
text-decoration:none;
color:white;
background:#ff4d4d;
padding:6px 12px;
border-radius:6px;
}

.footer-link:hover{
opacity:0.9;
}

</style>
</head>

<body>

<!-- HEADER -->
<header>

<div>📊 Admin Complaint Panel</div>

<div>
<a href="/admin" class="nav-btn">Dashboard</a>
<a href="/logout" class="nav-btn">Logout</a>
</div>

</header>

<!-- MAIN -->
<div class="main">

<div class="card">

<h2>📋 All Complaints</h2>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Complaint</th>
<th>Status</th>
</tr>

{% for c in complaints %}
<tr>
<td>{{c[0]}}</td>
<td>{{c[1]}}</td>
<td>{{c[2]}}</td>
<td>{{c[3]}}</td>
<td>{{c[4]}}</td>
</tr>
{% endfor %}

</table>

</div>

</div>

<!-- FOOTER -->
<footer class="admin-footer">

<div>© 2026 CDGI | Admin Panel</div>

<div>
<a href="/logout" class="footer-link">Logout</a>
</div>

</footer>

</body>
</html>
